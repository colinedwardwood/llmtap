    input_usd_per_mtok: 15.000
    output_usd_per_mtok: 75.000
  claude-opus-4-2025:
    input_usd_per_mtok: 15.000
    output_usd_per_mtok: 75.000
  # Sonnet 5 intro price ($2/$10) runs through 2026-08-31, then moves
  # to $3/$15 — bump on the next snapshot refresh.
  claude-sonnet-5:
    input_usd_per_mtok: 2.000
    output_usd_per_mtok: 10.000
  # sonnet 4, 4.5, 4.6 all sit at 3/15, so one family prefix covers
  # every snapshot pin.
  claude-sonnet-4:
    input_usd_per_mtok: 3.000
    output_usd_per_mtok: 15.000
  claude-haiku-4-5:
