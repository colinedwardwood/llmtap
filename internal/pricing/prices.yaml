# Built-in pricing catalogue. Values are the public list price at time
# of release (snapshot 2026-07 — keep in sync with pricing.Snapshot).
# Operators should override via `pricing.path` in config for negotiated
# rates.
#
# Schema: system → model-prefix → {input_usd_per_mtok, output_usd_per_mtok}
# Lookup is longest-prefix-match against the request/response model
# string (lowercased), so snapshot pins (e.g. "gpt-4o-mini-2024-07-18")
# inherit their family's rate. Order entries so more specific prefixes
# exist wherever a family shares a shorter prefix with a differently
# priced model (e.g. claude-opus-4 vs claude-opus-4-8).

