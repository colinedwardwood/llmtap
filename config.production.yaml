# Production-oriented starting point for llmtap.
# Copy, fill TLS + auth + telemetry, then:
#   llmtap check --config config.production.yaml
#   llmtap up --config config.production.yaml
#
# Local Default()/config.example.yaml leave max_in_flight and the circuit
# breaker off so a laptop demo never 429s itself. Turn both on in production —
# an unprotected proxy will absorb an upstream brownout until memory or
# graceful drain wedges. See README "Sizing".

listen: "0.0.0.0:4443"

# Required for a non-loopback bind (or set allow_insecure: true temporarily).
tls:
  cert_file: /etc/llmtap/tls/tls.crt
  key_file: /etc/llmtap/tls/tls.key

upstreams:
  - name: openai
    prefix: /v1
    target: https://api.openai.com
    provider: openai
    max_in_flight: 256
    breaker:
      failures: 5
      window: 30s
      recovery_window: 15s

  - name: anthropic
    prefix: /anthropic
    target: https://api.anthropic.com
    provider: anthropic
    strip_prefix: true
    max_in_flight: 256
    breaker:
      failures: 5
      window: 30s
      recovery_window: 15s

telemetry:
  # Point at your collector. Plaintext to a non-loopback host requires
  # insecure: true + acknowledge_insecure: true (or
  # LLMTAP_OTLP_ACKNOWLEDGE_INSECURE=true).
  endpoint: localhost:4317
  protocol: grpc
  insecure: true
  sample_ratio: 1.0
  timeout: 10s

content:
  mode: off
  redact: default

http:
  read_header_timeout: 30s
  idle_timeout: 120s
  shutdown_timeout: 30s
  body_read_timeout: 30s
  cert_reload_interval: 30s
  stream_idle_timeout: 5m

request:
  max_body_bytes: 33554432

service:
  name: llmtap
  namespace: observability
  environment: production

