apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llmtap.fullname" . }}
  labels:
    {{- include "llmtap.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "llmtap.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "llmtap.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "llmtap.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llmtap
          image: {{ include "llmtap.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["up", "--config", "/etc/llmtap/config.yaml"]
          ports:
            - name: https
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- toYaml .Values.env | nindent 12 }}
            - name: LLMTAP_HEALTHCHECK_INSECURE
              value: "true"
          volumeMounts:
            - name: config
              mountPath: /etc/llmtap/config.yaml
              subPath: config.yaml
              readOnly: true
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /etc/llmtap/tls
              readOnly: true
            {{- end }}
            {{- if .Values.auth.enabled }}
            - name: auth
              mountPath: {{ .Values.auth.mountPath }}
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: https
              scheme: HTTPS
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: https
              scheme: HTTPS
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      # Distroless has no sleep binary for preStop. SIGTERM flips /readyz
      # false immediately (BeginDrain); this grace window must cover
      # Endpoint propagation + http.shutdown_timeout stream drain.
      terminationGracePeriodSeconds: {{ add .Values.probes.preStopSleepSeconds .Values.probes.shutdownTimeoutSeconds }}
      volumes:
        - name: config
          configMap:
            name: {{ include "llmtap.fullname" . }}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
        {{- end }}
        {{- if .Values.auth.enabled }}
        - name: auth
          secret:
            secretName: {{ .Values.auth.secretName }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
